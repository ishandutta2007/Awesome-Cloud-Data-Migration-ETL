<svg fill="none" viewBox="0 0 1000 360" width="1000" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.7; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; r: 4; }
      50% { opacity: 1; r: 6.5; }
    }
    .orb-1 { animation: pulseOrb 8s infinite ease-in-out; }
    .orb-2 { animation: pulseOrb 10s infinite ease-in-out reverse; }
    .stream-1 { stroke-dasharray: 20, 10; animation: dashMove 14s linear infinite; }
    .stream-2 { stroke-dasharray: 15, 8; animation: dashMove 10s linear infinite reverse; }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .node-pulse { animation: nodeBlink 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="360" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs in Background -->
  <g filter="url(#softGlow)">
    <circle cx="150" cy="100" r="90" fill="#0284c7" class="orb-1"/>
    <circle cx="850" cy="260" r="110" fill="#7c3aed" class="orb-2"/>
    <circle cx="500" cy="40" r="80" fill="#0d9488" opacity="0.3"/>
  </g>

  <!-- Dynamic Data Pipeline Streams (Underneath Content) -->
  <g opacity="0.8">
    <!-- Stream Line 1 -->
    <path d="M 50 80 Q 250 140 500 70 T 950 110" fill="none" stroke="url(#streamGrad1)" stroke-width="3" class="stream-1"/>
    <!-- Stream Line 2 -->
    <path d="M 50 280 Q 280 200 520 290 T 950 240" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" class="stream-2"/>
    <!-- Flow Connector Crossings -->
    <path d="M 120 180 C 300 240, 700 120, 880 180" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8, 6" class="stream-1"/>
  </g>

  <!-- Floating Data Packets / Nodes -->
  <circle cx="280" cy="115" r="5" fill="#38bdf8" filter="url(#glow)" class="p1"/>
  <circle cx="720" cy="95" r="4.5" fill="#c084fc" filter="url(#glow)" class="p2"/>
  <circle cx="360" cy="245" r="5" fill="#34d399" filter="url(#glow)" class="p3"/>
  <circle cx="640" cy="275" r="4" fill="#60a5fa" filter="url(#glow)" class="p1"/>
  <circle cx="500" cy="70" r="5.5" fill="#38bdf8" class="node-pulse"/>
  <circle cx="520" cy="290" r="5" fill="#2dd4bf" class="node-pulse"/>

  <!-- Architecture Flow Boxes (Left to Right, stylized) -->
  <g opacity="0.85" transform="translate(0, 0)">
    <!-- Source Cloud Node -->
    <rect x="75" y="140" width="110" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="130" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">⚡ SOURCES</text>

    <!-- Arrow 1 -->
    <path d="M 195 161 L 225 161" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4, 3" class="stream-1"/>

    <!-- Ingestion / ETL Engine Node (Centered Accent) -->
    <rect x="235" y="136" width="130" height="50" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8" filter="url(#glow)"/>
    <text x="300" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff" text-anchor="middle">🔄 ETL / CDC</text>

    <!-- Arrow 2 -->
    <path d="M 375 161 L 405 161" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Central Pipeline Hub -->
    <rect x="415" y="140" width="170" height="42" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="500" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">⚙️ ORCHESTRATION</text>

    <!-- Arrow 3 -->
    <path d="M 595 161 L 625 161" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4, 3" class="stream-1"/>

    <!-- Transformation Node -->
    <rect x="635" y="136" width="130" height="50" rx="10" fill="#2e1065" stroke="#c084fc" stroke-width="1.8" filter="url(#glow)"/>
    <text x="700" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3e8ff" text-anchor="middle">📊 TRANSFORM</text>

    <!-- Arrow 4 -->
    <path d="M 775 161 L 805 161" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>

    <!-- Lakehouse Destination Node -->
    <rect x="815" y="140" width="115" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="872" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">🏛️ WAREHOUSE</text>
  </g>

  <!-- Foreground Main Title and Hierarchy (Protected z-index position) -->
  <g id="header-foreground">
    <!-- Main Title -->
    <text x="500" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="url(#titleGrad)" text-anchor="middle">
      Awesome Cloud Data Migration &amp; ETL
    </text>

    <!-- Subtitle / Tagline -->
    <text x="500" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2" text-anchor="middle">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; High-Performance Open-Source Pipelines
    </text>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(155, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="77" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">🚀 Batch &amp; Real-Time ELT</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="255" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c7d2fe" text-anchor="middle">🔄 Zero-Downtime CDC</text>

      <!-- Pill 3 -->
      <rect x="355" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="437" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e9d5ff" text-anchor="middle">⚡ Distributed Processing</text>

      <!-- Pill 4 -->
      <rect x="540" y="0" width="150" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="615" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">🛡️ Modern Data Stack</text>
    </g>
  </g>
</svg>
